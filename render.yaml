services:
  - type: web
    name: autergo-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: autergo-postgres
          property: connectionString
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_PRIMARY_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_PRIMARY_MODEL
        value: llama-3.3-70b-versatile

databases:
  - name: autergo-postgres
    plan: free
    databaseName: autergo_db
    user: autergo
